name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install markdown2 jinja2

      - name: Build blog
        run: python3 blogmaker.py

      - name: Run build tests
        run: python3 tests/test_build.py

      - name: Run quality tests
        run: python3 tests/test_quality.py
